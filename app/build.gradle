plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 35
    namespace "com.smock210.mypet"

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.smock210.mypet"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX Core - обновлено для API 35
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    // VK SDK 4.x
    implementation 'com.vk:android-sdk-core:4.1.0'
    implementation 'com.vk:android-sdk-api:4.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // Gson - обновлено
    implementation 'com.google.code.gson:gson:2.11.0'

    // Picarto - обновлено
    implementation 'com.squareup.picasso:picasso:2.8'

    // Firebase — отключён: выбран вход через VK (FIX_PLAN.md, 5.3)
    // implementation platform('com.google.firebase:firebase-bom:33.7.0')
    // implementation 'com.google.firebase:firebase-auth-ktx'
    // implementation 'com.google.android.gms:play-services-auth:21.1.1'

    // DataStore - обновлено
    implementation 'androidx.datastore:datastore-preferences:1.1.6'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // EncryptedSharedPreferences - обновлено для MasterKey
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Coroutines - обновлено для Kotlin 1.9.24
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Lifecycle - обновлено для Kotlin 1.9.24
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Biometric - обновлено
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // Room - обновлено для SDK 35 (используются только runtime/ktx/testing)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
}