plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// Секреты приложения VK (сервисный ключ) берём из local.properties —
// файл не коммитится, поэтому ключ не попадает в репозиторий.
// ВНИМАНИЕ: значение попадает в APK и может быть извлечено из него,
// для публичного приложения запросы с сервисным ключом лучше делать через сервер.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def vkServiceKey = localProps.getProperty('VK_SERVICE_KEY', '')
def googleWebClientId = localProps.getProperty('GOOGLE_WEB_CLIENT_ID', '')
def huaweiClientId = localProps.getProperty('HUAWEI_CLIENT_ID', '')
def huaweiClientSecret = localProps.getProperty('HUAWEI_CLIENT_SECRET', '')

android {
    compileSdk 35
    namespace "com.smock210.mypet"

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.smock210.mypet"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Секретные ключи нужны только для диагностики и служебных запросов.
            // В release-сборку они НЕ попадают: серверные секреты нельзя держать
            // в публичном APK.
            buildConfigField "String", "VK_SERVICE_KEY", "\"${vkServiceKey}\""
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
            buildConfigField "String", "HUAWEI_CLIENT_ID", "\"${huaweiClientId}\""
            buildConfigField "String", "HUAWEI_CLIENT_SECRET", "\"${huaweiClientSecret}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "VK_SERVICE_KEY", "\"\""
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"\""
            buildConfigField "String", "HUAWEI_CLIENT_ID", "\"\""
            buildConfigField "String", "HUAWEI_CLIENT_SECRET", "\"\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

// Конфигурация AppGallery Connect: модуль HMS SDK читает её из assets.
// Файл agconnect-services.json копируется в assets автоматически
// (аналог того, что делает плагин com.huawei.agconnect:agcp).
tasks.register('copyAgconnectServices', Copy) {
    from file('agconnect-services.json')
    into file('src/main/assets')
    rename { 'agconnect-services.json' }
}

tasks.named('preBuild') {
    dependsOn('copyAgconnectServices')
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX Core - обновлено для API 35
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    // VK SDK 4.x
    implementation 'com.vk:android-sdk-core:4.1.0'
    implementation 'com.vk:android-sdk-api:4.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // Gson - обновлено
    implementation 'com.google.code.gson:gson:2.11.0'

    // Picarto - обновлено
    implementation 'com.squareup.picasso:picasso:2.8'

    // Firebase — отключён: выбран вход через VK (FIX_PLAN.md, 5.3)
    // implementation platform('com.google.firebase:firebase-bom:33.7.0')
    // implementation 'com.google.firebase:firebase-auth-ktx'

    // Google Sign-In (вход через Google, FIX_PLAN.md, 6.10)
    implementation 'com.google.android.gms:play-services-auth:21.1.1'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    // Custom Tabs — вход через Huawei ID (OAuth в браузере, FIX_PLAN.md, 6.10)
    implementation 'androidx.browser:browser:1.8.0'

    // HMS SDK — нативный вход через Huawei ID (Account Kit)
    // Транзитивные зависимости указаны явно: POM-файлы HMS в зеркале
    // репозитория недоступны, используется разбор только артефактов.
    implementation 'com.huawei.hms:hwid:6.15.0.300@aar'
    implementation 'com.huawei.hms:base:6.13.0.304@aar'
    implementation 'com.huawei.hmf:tasks:1.5.2.301'

    // DataStore - обновлено
    implementation 'androidx.datastore:datastore-preferences:1.1.6'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // EncryptedSharedPreferences - обновлено для MasterKey
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Coroutines - обновлено для Kotlin 1.9.24
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Lifecycle - обновлено для Kotlin 1.9.24
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Biometric - обновлено
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // Room - обновлено для SDK 35 (используются только runtime/ktx/testing)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
}